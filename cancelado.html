<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pago cancelado | Crianza con Amor</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Nunito', sans-serif; background: #FDF8F5; color: #4A4A4A; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
    .card { background: #fff; border-radius: 24px; padding: 56px 48px; max-width: 560px; width: 100%; text-align: center; box-shadow: 0 16px 48px rgba(0,0,0,0.10); }
    .icon { font-size: 64px; margin-bottom: 24px; }
    h1 { font-family: 'Cormorant Garamond', serif; font-size: 2rem; color: #2D2D2D; margin-bottom: 16px; }
    p { font-size: 1rem; line-height: 1.7; color: #6A6A6A; margin-bottom: 12px; }
    .btns { display: flex; gap: 14px; justify-content: center; margin-top: 28px; flex-wrap: wrap; }
    .btn-primary { background: #C17858; color: #fff; padding: 14px 32px; border-radius: 100px; font-weight: 700; text-decoration: none; font-size: 1rem; transition: background 0.2s; }
    .btn-primary:hover { background: #9E5E42; }
    .btn-secondary { background: transparent; color: #C17858; border: 2px solid #C17858; padding: 12px 32px; border-radius: 100px; font-weight: 700; text-decoration: none; font-size: 1rem; transition: all 0.2s; }
    .btn-secondary:hover { background: #C17858; color: #fff; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">😔</div>
    <h1>El pago no se completó</h1>
    <p>No te preocupes — no se realizó ningún cobro. Puedes intentarlo de nuevo cuando quieras.</p>
    <p>Si tuviste algún problema técnico o tienes dudas sobre el pago, escríbenos con gusto.</p>
    <div class="btns">
      <a href="/#ebooks" class="btn-primary">Intentar de nuevo</a>
      <a href="/" class="btn-secondary">Volver al inicio</a>
    </div>
  </div>
</body>
</html>
