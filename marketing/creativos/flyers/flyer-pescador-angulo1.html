<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Flyer Pescador — Ángulo 1</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:1080px; height:1350px; font-family:'Arial Black', Arial, sans-serif;
         background: linear-gradient(165deg, #04121f 0%, #0a2a42 55%, #041824 100%);
         color:#fff; overflow:hidden; position:relative; }
  .linea-rota { position:absolute; top:310px; left:-40px; width:1160px; height:8px;
                background:repeating-linear-gradient(90deg,#39d0ff 0 340px, transparent 340px 480px);
                transform:rotate(-7deg); box-shadow:0 0 24px #39d0ff88; }
  .contenido { position:relative; z-index:2; padding:90px 80px; height:100%;
               display:flex; flex-direction:column; }
  .etiqueta { display:inline-block; background:#ff4d3a; color:#fff; font-size:30px;
              letter-spacing:4px; padding:14px 28px; border-radius:8px; width:max-content; }
  h1 { font-size:104px; line-height:1.04; margin-top:48px; text-transform:uppercase; }
  h1 .rojo { color:#ff4d3a; }
  h1 .celeste { color:#39d0ff; }
  .sub { margin-top:44px; font-size:42px; font-family:Arial, sans-serif; font-weight:bold;
         color:#cfe9f7; line-height:1.35; max-width:880px; }
  .prueba { margin-top:auto; display:flex; align-items:center; gap:28px;
            background:#ffffff12; border:2px solid #39d0ff55; border-radius:20px; padding:34px 40px; }
  .prueba .num { font-size:76px; color:#39d0ff; }
  .prueba .txt { font-size:34px; font-family:Arial, sans-serif; font-weight:bold; line-height:1.3; }
  .pie { margin-top:50px; display:flex; align-items:center; justify-content:space-between; }
  .logo { width:230px; height:110px; border:3px dashed #ffffff66; border-radius:14px;
          display:flex; align-items:center; justify-content:center; font-size:30px; color:#ffffff99; }
  .cta { background:#ff4d3a; color:#fff; font-size:44px; padding:30px 54px; border-radius:16px;
         text-transform:uppercase; letter-spacing:1px; box-shadow:0 10px 30px #ff4d3a55; }
</style>
</head>
<body>
  <div class="linea-rota"></div>
  <div class="contenido">
    <span class="etiqueta">PESCADOR, ESTO YA TE PASÓ</span>
    <h1>El pez de tu vida<br><span class="rojo">no da segundas</span><br><span class="rojo">oportunidades</span></h1>
    <p class="sub">Meses esperando esa pelea… y la línea barata te la robó en 3 segundos. Con la trenzada <span style="color:#39d0ff">[MARCA]</span>, la pelea la terminas <u>tú</u>.</p>
    <div class="prueba">
      <div class="num">💪</div>
      <div class="txt">Resistencia real al nudo y a la corrida.<br>Aguanta temporadas, no salidas.</div>
    </div>
    <div class="pie">
      <div class="logo">[LOGO]</div>
      <div class="cta">Consíguela hoy ➜</div>
    </div>
  </div>
</body>
</html>
